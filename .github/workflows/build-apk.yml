name: Build Sharma Battle Royale APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'sharma-battle-royale-project-fixed.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download game files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract game project
        run: unzip -q sharma-battle-royale-project-fixed.zip -d project

      - name: Build APK
        working-directory: project/sharma-battle-royale
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Sharma-Battle-Royale-APK
          path: project/sharma-battle-royale/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
